<style>
:root{--bg:#EEF2F1;--surface:#fff;--ink:#18211F;--muted:#5B6866;--line:#D3DBD9;--accent:#2D6A5E;--warn:#A8452F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--surface:#1A2220;--ink:#E4ECE9;--muted:#97A5A1;--line:#2E3936;--accent:#6FB8A7;--warn:#E3866F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.lk{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
input{font:inherit;font-size:18px;letter-spacing:.08em;text-transform:uppercase;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;font-family:ui-monospace,Menlo,monospace}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:16px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:100%}
button.pr{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
button:disabled{opacity:.6}
.err{color:var(--warn);font-size:14px;min-height:1.2em}
.sep{height:1px;background:var(--line);margin:4px 0}
.small{font-size:13px}
.wait{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-size:15px}
</style>
</head>
<body>

    <div class="err" id="err" role="alert"></div>
    <button class="pr" type="submit" id="go">Открыть</button>

    <button type="button" id="exp">Сохранить мои данные</button>
    <div class="err" id="err2" role="status"></div>
  </form>
</div>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=b=>{let s="";const a=new Uint8Array(b);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
const $=id=>document.getElementById(id);
const enc=new TextEncoder();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(_){}}
async function unwrap(key){
  const base=await crypto.subtle.importKey("raw",enc.encode(key),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(BOX.s),iterations:BOX.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  for(const w of BOX.k){try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(w.i),additionalData:enc.encode("nedelya-key")},kek,ub(w.c)))}catch(_){}}
  return null;
}
async function openApp(M){
  const k=await crypto.subtle.importKey("raw",M,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(BOX.iv),additionalData:enc.encode("nedelya")},k,ub(BOX.d)));
  if(document.readyState==="loading")await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
async function tryKey(key){
  const M=await unwrap(key);if(!M)return false;
  LS.set("nk",key);LS.set("nm",JSON.stringify({b:BOX.b,m:bu(M)}));
  await openApp(M);return true;
}
function show(msg){$("wait").hidden=true;$("lk").hidden=false;if(msg){$("err").textContent=msg}setTimeout(()=>{try{$("k").focus()}catch(_){}},50)}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();const key=norm($("k").value);
  if(key.length!==16){$("err").textContent="Ключ — 16 букв и цифр, например 7K3Q-9XFM-T2PA-H4WD.";return}
  $("go").disabled=true;$("go").textContent="Проверяю…";$("err").textContent="";
  let ok=false;try{ok=await tryKey(key)}catch(_){ok=false}
  if(!ok){$("go").disabled=false;$("go").textContent="Открыть";$("err").textContent="Ключ не подошёл. Проверьте, что он введён без ошибок."}
});
$("k").addEventListener("input",()=>{const v=norm($("k").value).slice(0,16);const f=v.replace(/(.{4})(?=.)/g,"$1-");if($("k").value!==f)$("k").value=f});
function idbGet(){return new Promise(res=>{let r;try{r=indexedDB.open("nedelya-local",1)}catch(_){res(null);return}
  r.onupgradeneeded=()=>{try{r.result.createObjectStore("kv")}catch(_){}};r.onerror=()=>res(null);
  r.onsuccess=()=>{try{const t=r.result.transaction("kv","readonly").objectStore("kv").get("data");t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(_){res(null)}}})}
$("exp").addEventListener("click",async()=>{
  const out=$("err2");out.textContent="";
  const raw=await idbGet();let data=null;try{data=raw?JSON.parse(raw):null}catch(_){}
  if(!data||!Object.keys(data).some(k=>k!=="meta")){out.textContent="В этом телефоне нет записей планера.";return}
  const d=new Date(),p=n=>String(n).padStart(2,"0"),name=`nedelya-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
  const blob=new Blob([JSON.stringify({app:"nedelya",dataVer:(data.meta&&data.meta.data&&data.meta.data.v)||0,at:d.toISOString(),data})],{type:"application/json"});
  let ok=false;
  try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});ok=true}}catch(e){if(e&&e.name==="AbortError")return}
  if(!ok){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
  out.textContent="Файл с записями сохранён: "+name;
});
(async()=>{
  if(!window.crypto||!crypto.subtle){show("Этот браузер не умеет расшифровывать планер. Откройте ссылку в Chrome или Safari.");return}
  try{const nm=JSON.parse(LS.get("nm")||"null");if(nm&&nm.b===BOX.b){await openApp(ub(nm.m));return}}catch(_){LS.del("nm")}
  const k=LS.get("nk");
  if(k){let ok=false;try{ok=await tryKey(norm(k))}catch(_){}if(ok)return;
    $("msg").textContent="Ваш ключ больше не подходит. Попросите новый у того, кто дал вам планер.";show();return}
  show();
})();
})();
</script>
</body>
